name: Hospital App CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app.py test_app.py --max-line-length=120 --ignore=E501,W503

      - name: Security scan with bandit
        run: |
          pip install bandit
          bandit -r app.py -ll --skip B105,B106

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest --cov=app --cov-report=term-missing --cov-fail-under=50
        env:
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          DATABASE_URL: "sqlite:///:memory:"

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t hospital-app:${{ github.sha }} .

      - name: Verify container starts
        run: |
          docker run -d --name test-container \
            -e SECRET_KEY=ci-test-key \
            -p 5000:5000 \
            hospital-app:${{ github.sha }}
          sleep 8
          curl --fail http://localhost:5000/ || exit 1
          docker stop test-container
