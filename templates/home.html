<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0d1b2a; color: #fff; }
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 2rem; }
    .hero h1 { font-size: 2.6rem; font-weight: 700; }
    .hero p { font-size: 1.1rem; color: #adb5bd; max-width: 480px; margin: 1rem auto; }
    .btn-login { padding: .75rem 2.5rem; font-size: 1rem; border-radius: 30px; }
    .features { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; margin-top: 3rem; }
    .feature-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1.25rem 1.5rem; width: 180px; text-align: center; }
    .feature-card .icon { font-size: 2rem; margin-bottom: .5rem; }
    .feature-card p { font-size: 13px; color: #adb5bd; margin: 0; }
  </style>
</head>
<body>
<div class="hero">
  <h1>&#127973; Hospital Management System</h1>
  <p>Manage patients, doctors, lab requests, and pharmacy inventory — all in one place.</p>
  <a href="/login" class="btn btn-primary btn-login mt-2">Login to continue</a>

  <div class="features">
    <div class="feature-card">
      <div class="icon">&#128101;</div>
      <p>Patient records</p>
    </div>
    <div class="feature-card">
      <div class="icon">&#129657;</div>
      <p>Doctor prescriptions</p>
    </div>
    <div class="feature-card">
      <div class="icon">&#129514;</div>
      <p>Lab requests</p>
    </div>
    <div class="feature-card">
      <div class="icon">&#128138;</div>
      <p>Pharmacy stock</p>
    </div>
  </div>
</div>
</body>
</html>
