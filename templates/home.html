<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital MS — Welcome</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#fff;min-height:100vh;overflow-x:hidden}
    .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;position:relative}
    .bg-circles{position:absolute;inset:0;overflow:hidden;z-index:0}
    .circle{position:absolute;border-radius:50%;opacity:.08;animation:float 8s ease-in-out infinite}
    .c1{width:600px;height:600px;background:#2563eb;top:-200px;left:-200px;animation-delay:0s}
    .c2{width:400px;height:400px;background:#60a5fa;bottom:-100px;right:-100px;animation-delay:3s}
    .c3{width:250px;height:250px;background:#818cf8;top:40%;left:60%;animation-delay:1.5s}
    @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
    .hero-content{position:relative;z-index:1;animation:fadeUp .8s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
    .hero-icon{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#2563eb,#60a5fa);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 1.5rem;box-shadow:0 20px 40px rgba(37,99,235,.4);animation:pulse 3s ease infinite}
    @keyframes pulse{0%,100%{box-shadow:0 20px 40px rgba(37,99,235,.4)}50%{box-shadow:0 20px 60px rgba(37,99,235,.6)}}
    h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:.75rem}
    h1 span{background:linear-gradient(135deg,#60a5fa,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .subtitle{font-size:1.1rem;color:#94a3b8;max-width:520px;margin:0 auto 2.5rem;line-height:1.6}
    .btn-login{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:14px 32px;border-radius:14px;font-size:16px;font-weight:600;text-decoration:none;transition:all .2s;box-shadow:0 8px 24px rgba(37,99,235,.4)}
    .btn-login:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(37,99,235,.5);color:#fff}
    .features{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:3rem;animation:fadeUp .8s ease .3s both}
    .feat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:1.25rem 1.5rem;width:160px;text-align:center;transition:all .2s;backdrop-filter:blur(10px)}
    .feat:hover{background:rgba(255,255,255,.08);transform:translateY(-4px)}
    .feat-icon{font-size:28px;margin-bottom:.5rem;display:block}
    .feat-label{font-size:13px;color:#94a3b8}
  </style>
</head>
<body>
<div class="hero">
  <div class="bg-circles">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
  </div>
  <div class="hero-content">
    <div class="hero-icon">&#127973;</div>
    <h1>Hospital <span>Management</span><br>System</h1>
    <p class="subtitle">A complete platform for managing patients, doctors, lab requests, and pharmacy inventory — all in one place.</p>
    <a href="/login" class="btn-login">
      <i class="bi bi-box-arrow-in-right" style="font-family:'bootstrap-icons';font-size:18px"></i>
      Login to continue
    </a>
    <div class="features">
      <div class="feat"><span class="feat-icon">&#128101;</span><div class="feat-label">Patients</div></div>
      <div class="feat"><span class="feat-icon">&#129657;</span><div class="feat-label">Doctors</div></div>
      <div class="feat"><span class="feat-icon">&#129514;</span><div class="feat-label">Lab</div></div>
      <div class="feat"><span class="feat-icon">&#128138;</span><div class="feat-label">Pharmacy</div></div>
    </div>
  </div>
</div>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
