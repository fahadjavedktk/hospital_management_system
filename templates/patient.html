{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">My health record</h2>

<div id="banner" class="alert alert-danger" style="display:none"></div>
<div id="loading" class="text-muted">Loading your records...</div>

<div id="content" style="display:none">

  <div class="row g-4">

    <!-- Lab Results -->
    <div class="col-md-6">
      <div class="card p-4 shadow-sm h-100">
        <h5 class="mb-3">Lab results</h5>
        <ul id="labResults" class="list-group"></ul>
        <p id="noLabs" class="text-muted" style="display:none">No lab tests ordered.</p>
      </div>
    </div>

    <!-- Prescriptions -->
    <div class="col-md-6">
      <div class="card p-4 shadow-sm h-100">
        <h5 class="mb-3">Prescriptions</h5>
        <ul id="presResults" class="list-group"></ul>
        <p id="noPres" class="text-muted" style="display:none">No prescriptions issued.</p>
      </div>
    </div>

  </div>
</div>

<script>
  function escHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(String(str)));
    return d.innerHTML;
  }

  async function load() {
    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const bannerEl  = document.getElementById('banner');

    try {
      const res = await fetch('/my');

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        bannerEl.textContent = data.error || 'Could not load your records.';
        bannerEl.style.display = 'block';
        loadingEl.style.display = 'none';
        return;
      }

      const data = await res.json();
      loadingEl.style.display = 'none';
      contentEl.style.display = 'block';

      // Lab results
      const labList = document.getElementById('labResults');
      const noLabs  = document.getElementById('noLabs');
      if (data.labs.length === 0) {
        noLabs.style.display = 'block';
      } else {
        data.labs.forEach(l => {
          const li = document.createElement('li');
          li.className = 'list-group-item d-flex justify-content-between align-items-center';
          const isPending = l.result === 'Pending';
          li.innerHTML = `
            <span>${escHtml(l.test)}</span>
            <span class="badge ${isPending ? 'bg-warning text-dark' : 'bg-success'}">
              ${escHtml(l.result)}
            </span>`;
          labList.appendChild(li);
        });
      }

      // Prescriptions
      const presList = document.getElementById('presResults');
      const noPres   = document.getElementById('noPres');
      if (data.pres.length === 0) {
        noPres.style.display = 'block';
      } else {
        data.pres.forEach(p => {
          const li = document.createElement('li');
          li.className = 'list-group-item d-flex justify-content-between align-items-center';
          li.innerHTML = `
            <span>${escHtml(p.medicine)}</span>
            <span class="badge bg-secondary">Qty: ${p.quantity}</span>`;
          presList.appendChild(li);
        });
      }

    } catch (e) {
      bannerEl.textContent = 'Network error. Please refresh the page.';
      bannerEl.style.display = 'block';
      loadingEl.style.display = 'none';
    }
  }

  load();
</script>

{% endblock %}
