{% extends "base.html" %}
{% block content %}

<div class="page-title"><i class="bi bi-heart-pulse"></i> My Health Record</div>
<div id="banner" class="alert-banner alert-danger"></div>
<div id="loading" class="loading-state"><div class="spinner"></div> Loading your records...</div>

<div id="content" style="display:none">

  <div class="hcard mb-3" id="summaryCard">
    <div style="display:flex;align-items:center;gap:16px">
      <div style="width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#60a5fa);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff" id="patientAvatar"></div>
      <div>
        <div style="font-size:20px;font-weight:700;color:#0f172a" id="patientName"></div>
        <div style="font-size:13px;color:#64748b;margin-top:2px">Assigned doctor: <strong id="patientDoctor"></strong></div>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <div class="hcard h-100">
        <div class="hcard-title"><i class="bi bi-eyedropper"></i> Lab results</div>
        <div id="labResults"></div>
        <div id="noLabs" class="empty-state" style="display:none"><i class="bi bi-clipboard2-x"></i><p>No lab tests ordered yet</p></div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="hcard h-100">
        <div class="hcard-title"><i class="bi bi-capsule"></i> Prescriptions</div>
        <div id="presResults"></div>
        <div id="noPres" class="empty-state" style="display:none"><i class="bi bi-prescription"></i><p>No prescriptions issued yet</p></div>
      </div>
    </div>
  </div>
</div>

<script>
function escHtml(s){const d=document.createElement('div');d.appendChild(document.createTextNode(String(s)));return d.innerHTML;}

async function load(){
  const loadEl=document.getElementById('loading');
  const contentEl=document.getElementById('content');
  const bannerEl=document.getElementById('banner');
  try{
    const res=await fetch('/my');
    if(!res.ok){
      const data=await res.json().catch(()=>({}));
      bannerEl.textContent=data.error||'Could not load your records.';
      bannerEl.style.display='block';
      loadEl.style.display='none'; return;
    }
    const data=await res.json();
    loadEl.style.display='none'; contentEl.style.display='block';

    const initial=data.patient?data.patient[0].toUpperCase():'?';
    document.getElementById('patientAvatar').textContent=initial;
    document.getElementById('patientName').textContent=data.patient;
    document.getElementById('patientDoctor').textContent=data.doctor||'Not assigned';

    const labList=document.getElementById('labResults');
    const noLabs=document.getElementById('noLabs');
    if(!data.labs||data.labs.length===0){noLabs.style.display='block';}
    else{
      data.labs.forEach((l,i)=>{
        const isPending=l.result==='Pending';
        const div=document.createElement('div');
        div.className='hlist-item'; div.style.animationDelay=(i*0.06)+'s';
        div.innerHTML=`<div><div style="font-weight:600;font-size:13px">${escHtml(l.test)}</div></div><span class="${isPending?'badge-pending':'badge-done'}">${escHtml(l.result)}</span>`;
        labList.appendChild(div);
      });
    }

    const presList=document.getElementById('presResults');
    const noPres=document.getElementById('noPres');
    if(!data.pres||data.pres.length===0){noPres.style.display='block';}
    else{
      data.pres.forEach((p,i)=>{
        const div=document.createElement('div');
        div.className='hlist-item'; div.style.animationDelay=(i*0.06)+'s';
        div.innerHTML=`<div><div style="font-weight:600;font-size:13px">${escHtml(p.medicine)}</div></div><span class="badge-info">Qty: ${p.quantity}</span>`;
        presList.appendChild(div);
      });
    }
  }catch(e){
    bannerEl.textContent='Network error. Please refresh the page.';
    bannerEl.style.display='block';
    loadEl.style.display='none';
  }
}
load();
</script>
{% endblock %}
