{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">User panel</h2>

<div id="banner" class="alert" style="display:none"></div>

<div class="card p-4 shadow-sm">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">All patients</h5>
    <button onclick="load()" class="btn btn-outline-info btn-sm">Refresh</button>
  </div>

  <div id="loading" class="text-muted">Loading...</div>
  <ul id="list" class="list-group"></ul>
  <p id="emptyMsg" class="text-muted text-center mt-3" style="display:none">No patients found.</p>
</div>

<script>
  function escHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(String(str)));
    return d.innerHTML;
  }

  async function load() {
    const loadingEl = document.getElementById('loading');
    const listEl    = document.getElementById('list');
    const emptyEl   = document.getElementById('emptyMsg');

    loadingEl.style.display = 'block';
    loadingEl.textContent = 'Loading...';
    listEl.innerHTML = '';

    try {
      const res = await fetch('/patients');
      if (!res.ok) {
        loadingEl.textContent = 'Access denied or failed to load.';
        loadingEl.className = 'text-danger';
        return;
      }

      const data = await res.json();
      loadingEl.style.display = 'none';

      if (data.length === 0) { emptyEl.style.display = 'block'; return; }
      emptyEl.style.display = 'none';

      data.forEach(p => {
        const li = document.createElement('li');
        li.className = 'list-group-item';
        li.innerHTML = `
          <strong>${escHtml(p.name)}</strong>
          <span class="text-muted ms-2">
            Age: ${p.age} &middot; Dr. ${escHtml(p.doctor)}
          </span>`;
        listEl.appendChild(li);
      });
    } catch (e) {
      loadingEl.textContent = 'Network error. Please refresh.';
      loadingEl.className = 'text-danger';
    }
  }

  load();
</script>

{% endblock %}
