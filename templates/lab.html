{% extends "base.html" %}
{% block content %}

<div class="page-title"><i class="bi bi-eyedropper"></i> Lab Panel</div>
<div id="banner" class="alert-banner"></div>

<div class="row g-3 mb-3">
  <div class="col-md-4"><div class="stat-card"><div class="stat-icon" style="background:#fef3c7"><span style="font-size:22px">&#129514;</span></div><div><div class="stat-val" id="totalCount">—</div><div class="stat-lbl">Total requests</div></div></div></div>
  <div class="col-md-4"><div class="stat-card"><div class="stat-icon" style="background:#fef2f2"><span style="font-size:22px">&#9201;</span></div><div><div class="stat-val" id="pendingCount">—</div><div class="stat-lbl">Pending</div></div></div></div>
  <div class="col-md-4"><div class="stat-card"><div class="stat-icon" style="background:#f0fdf4"><span style="font-size:22px">&#9989;</span></div><div><div class="stat-val" id="doneCount">—</div><div class="stat-lbl">Completed</div></div></div></div>
</div>

<div class="hcard">
  <div class="hcard-title" style="justify-content:space-between">
    <span><i class="bi bi-list-check"></i> Lab requests</span>
    <button onclick="loadLab()" class="btn-secondary-custom"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
  </div>
  <div id="loading" class="loading-state"><div class="spinner"></div> Loading lab requests...</div>
  <div id="labList"></div>
  <div id="emptyMsg" class="empty-state" style="display:none"><i class="bi bi-clipboard2-x"></i><p>No lab requests found</p></div>
</div>

<!-- Result Entry Modal -->
<div id="resultOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:2000;align-items:center;justify-content:center;backdrop-filter:blur(4px)">
  <div style="background:#fff;border-radius:20px;padding:2rem;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;animation:popIn .3s cubic-bezier(.34,1.56,.64,1)">
    <div style="font-size:16px;font-weight:700;margin-bottom:.25rem;color:#0f172a">Enter lab result</div>
    <div id="modalPatient" style="font-size:13px;color:#64748b;margin-bottom:1.25rem"></div>

    <input type="hidden" id="modalId">
    <input type="hidden" id="modalCurrent">

    <div class="mb-3">
      <label class="form-label">Result / Findings</label>
      <textarea id="resultText" class="form-control" rows="3" placeholder="e.g. Normal, Elevated white blood cells, Fracture detected at L3..." style="resize:vertical"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Report image <span style="color:#94a3b8;font-weight:400">(optional — JPG, PNG, PDF screenshot)</span></label>
      <div id="uploadZone" onclick="document.getElementById('imgInput').click()" style="border:2px dashed #e2e8f0;border-radius:12px;padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s;background:#fafbfc">
        <div style="font-size:28px;margin-bottom:.4rem">&#128444;</div>
        <div style="font-size:13px;color:#64748b">Click to upload or drag &amp; drop an image</div>
        <div style="font-size:11px;color:#94a3b8;margin-top:4px">PNG, JPG, JPEG — max 5MB</div>
      </div>
      <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="handleImage(this)">
      <div id="imgPreview" style="margin-top:.75rem;display:none">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem">
          <span style="font-size:13px;font-weight:500;color:#15803d">&#9989; Image ready to upload</span>
          <button onclick="clearImage()" style="font-size:12px;color:#dc2626;background:none;border:none;cursor:pointer">Remove</button>
        </div>
        <img id="imgThumb" style="width:100%;max-height:200px;object-fit:contain;border-radius:10px;border:1px solid #e2e8f0">
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-top:1rem">
      <button onclick="submitResult()" id="submitResultBtn" class="btn-primary-custom" style="flex:1"><i class="bi bi-check2-circle"></i> Save result</button>
      <button onclick="closeModal()" class="btn-secondary-custom" style="flex:1">Cancel</button>
    </div>
  </div>
</div>

<!-- Image Viewer Modal -->
<div id="viewerOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:3000;align-items:center;justify-content:center" onclick="closeViewer()">
  <div style="max-width:90vw;max-height:90vh;position:relative" onclick="event.stopPropagation()">
    <button onclick="closeViewer()" style="position:absolute;top:-36px;right:0;background:none;border:none;color:#fff;font-size:24px;cursor:pointer">&#10005;</button>
    <img id="viewerImg" style="max-width:100%;max-height:85vh;border-radius:12px;object-fit:contain">
  </div>
</div>

<style>
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
#uploadZone:hover{border-color:#2563eb;background:#eff6ff}
#uploadZone.dragover{border-color:#2563eb;background:#eff6ff}
</style>

<script>
function escHtml(s){const d=document.createElement('div');d.appendChild(document.createTextNode(String(s)));return d.innerHTML;}
let currentImage=null;

function showBanner(msg,type){
  const b=document.getElementById('banner');
  b.className='alert-banner alert-'+type;
  b.textContent=msg; b.style.display='block';
  b.style.animation='none'; b.offsetHeight; b.style.animation='slideDown .25s ease';
  setTimeout(()=>b.style.display='none',5000);
}

/* ── DRAG & DROP ── */
const zone=document.getElementById('uploadZone');
zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover');});
zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
zone.addEventListener('drop',e=>{
  e.preventDefault(); zone.classList.remove('dragover');
  const file=e.dataTransfer.files[0];
  if(file) processImageFile(file);
});

function handleImage(input){
  if(input.files&&input.files[0]) processImageFile(input.files[0]);
}

function processImageFile(file){
  if(!file.type.startsWith('image/')){showBanner('Please upload an image file (PNG, JPG).','warning');return;}
  if(file.size>5*1024*1024){showBanner('Image must be under 5MB.','warning');return;}
  const reader=new FileReader();
  reader.onload=e=>{
    currentImage=e.target.result;
    document.getElementById('imgThumb').src=currentImage;
    document.getElementById('imgPreview').style.display='block';
    document.getElementById('uploadZone').style.display='none';
  };
  reader.readAsDataURL(file);
}

function clearImage(){
  currentImage=null;
  document.getElementById('imgPreview').style.display='none';
  document.getElementById('uploadZone').style.display='block';
  document.getElementById('imgInput').value='';
}

/* ── MODAL OPEN / CLOSE ── */
function openModal(id, patientName, test, current){
  document.getElementById('modalId').value=id;
  document.getElementById('modalCurrent').value=current;
  document.getElementById('modalPatient').textContent=`Patient: ${patientName}  ·  Test: ${test}`;
  document.getElementById('resultText').value=current==='Pending'?'':current;
  clearImage();
  document.getElementById('resultOverlay').style.display='flex';
  document.getElementById('resultText').focus();
}

function closeModal(){
  document.getElementById('resultOverlay').style.display='none';
  clearImage();
}

/* ── SUBMIT RESULT ── */
async function submitResult(){
  const id=document.getElementById('modalId').value;
  const result=document.getElementById('resultText').value.trim();
  const btn=document.getElementById('submitResultBtn');
  if(!result){showBanner('Please enter the result findings.','warning');return;}
  btn.disabled=true;
  btn.innerHTML='<div class="spinner" style="display:inline-block;border-color:rgba(255,255,255,.4);border-top-color:#fff;margin-right:6px"></div>Saving...';
  try{
    const payload={id:Number(id),result};
    if(currentImage) payload.report_image=currentImage;
    const res=await fetch('/lab_update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json();
    if(!res.ok){showBanner(data.error||'Failed to save.','danger');return;}
    showBanner('Result saved — doctor can now see it immediately.','success');
    closeModal(); loadLab();
  }catch(e){showBanner('Network error.','danger');}
  finally{btn.disabled=false;btn.innerHTML='<i class="bi bi-check2-circle"></i> Save result';}
}

/* ── IMAGE VIEWER ── */
function viewImage(src){
  document.getElementById('viewerImg').src=src;
  document.getElementById('viewerOverlay').style.display='flex';
}
function closeViewer(){document.getElementById('viewerOverlay').style.display='none';}

/* ── LOAD LAB REQUESTS ── */
async function loadLab(){
  const loadEl=document.getElementById('loading');
  const listEl=document.getElementById('labList');
  const emptyEl=document.getElementById('emptyMsg');
  loadEl.style.display='block'; listEl.innerHTML='';
  try{
    const res=await fetch('/lab');
    if(!res.ok){loadEl.textContent='Failed to load.';return;}
    const data=await res.json();
    loadEl.style.display='none';
    document.getElementById('totalCount').textContent=data.length;
    const pending=data.filter(x=>x.result==='Pending').length;
    document.getElementById('pendingCount').textContent=pending;
    document.getElementById('doneCount').textContent=data.length-pending;
    if(data.length===0){emptyEl.style.display='block';return;}
    emptyEl.style.display='none';
    data.forEach((x,i)=>{
      const isPending=x.result==='Pending';
      const div=document.createElement('div');
      div.className='hlist-item'; div.style.animationDelay=(i*0.05)+'s';
      div.innerHTML=`
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:42px;height:42px;border-radius:12px;background:${isPending?'#fef3c7':'#f0fdf4'};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${isPending?'⏰':'✅'}</div>
          <div>
            <div style="font-weight:600;font-size:14px">${escHtml(x.patient_name)} <span style="color:#94a3b8;font-weight:400;font-size:12px">· Dr. ${escHtml(x.doctor_name)}</span></div>
            <div style="font-size:12px;color:#64748b">${escHtml(x.test)} ${x.has_image?'<span style="color:#2563eb;font-weight:500">· 📎 Image attached</span>':''}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
          ${x.has_image?`<button class="btn-secondary-custom" onclick="viewImage('${x.report_image.replace(/'/g,"\\'")}')">📷 View</button>`:''}
          <span class="${isPending?'badge-pending':'badge-done'}">${escHtml(x.result)}</span>
          <button class="${isPending?'btn-primary-custom':'btn-secondary-custom'}" onclick="openModal(${x.id},'${escHtml(x.patient_name)}','${escHtml(x.test)}','${escHtml(x.result)}')" style="font-size:12px;padding:6px 14px">
            ${isPending?'Enter result':'Update'}
          </button>
        </div>`;
      listEl.appendChild(div);
    });
  }catch(e){loadEl.textContent='Network error.';}
}
loadLab();
</script>
{% endblock %}
