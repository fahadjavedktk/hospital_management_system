{% extends "base.html" %}
{% block content %}

<div class="page-title"><i class="bi bi-eyedropper"></i> Lab Panel</div>
<div id="banner" class="alert-banner"></div>

<div class="row g-3 mb-3">
  <div class="col-md-4"><div class="stat-card"><div class="stat-icon" style="background:#fef3c7"><span style="font-size:22px">&#129514;</span></div><div><div class="stat-val" id="totalCount">—</div><div class="stat-lbl">Total requests</div></div></div></div>
  <div class="col-md-4"><div class="stat-card"><div class="stat-icon" style="background:#fef2f2"><span style="font-size:22px">&#9201;</span></div><div><div class="stat-val" id="pendingCount">—</div><div class="stat-lbl">Pending</div></div></div></div>
  <div class="col-md-4"><div class="stat-card"><div class="stat-icon" style="background:#f0fdf4"><span style="font-size:22px">&#9989;</span></div><div><div class="stat-val" id="doneCount">—</div><div class="stat-lbl">Completed</div></div></div></div>
</div>

<div class="hcard">
  <div class="hcard-title" style="justify-content:space-between">
    <span><i class="bi bi-list-check"></i> Lab requests</span>
    <button onclick="loadLab()" class="btn-secondary-custom"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
  </div>
  <div id="loading" class="loading-state"><div class="spinner"></div> Loading lab requests...</div>
  <div id="labList"></div>
  <div id="emptyMsg" class="empty-state" style="display:none"><i class="bi bi-clipboard2-x"></i><p>No lab requests found</p></div>
</div>

<script>
function escHtml(s){const d=document.createElement('div');d.appendChild(document.createTextNode(String(s)));return d.innerHTML;}
function showBanner(msg,type){
  const b=document.getElementById('banner');
  b.className='alert-banner alert-'+type;
  b.textContent=msg; b.style.display='block';
  b.style.animation='none'; b.offsetHeight; b.style.animation='slideDown .25s ease';
  setTimeout(()=>b.style.display='none',4000);
}

async function updateResult(id,current){
  const result=prompt('Enter lab result:',current==='Pending'?'':current);
  if(result===null||result.trim()==='') return;
  try{
    const res=await fetch('/lab_update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,result:result.trim()})});
    const data=await res.json();
    if(!res.ok){showBanner(data.error||'Update failed.','danger');return;}
    showBanner('Result updated successfully.','success'); loadLab();
  }catch(e){showBanner('Network error.','danger');}
}

async function loadLab(){
  const loadEl=document.getElementById('loading');
  const listEl=document.getElementById('labList');
  const emptyEl=document.getElementById('emptyMsg');
  loadEl.style.display='block'; listEl.innerHTML='';
  try{
    const res=await fetch('/lab');
    if(!res.ok){loadEl.textContent='Failed to load.';return;}
    const data=await res.json();
    loadEl.style.display='none';
    document.getElementById('totalCount').textContent=data.length;
    const pending=data.filter(x=>x.result==='Pending').length;
    document.getElementById('pendingCount').textContent=pending;
    document.getElementById('doneCount').textContent=data.length-pending;
    if(data.length===0){emptyEl.style.display='block';return;}
    emptyEl.style.display='none';
    data.forEach((x,i)=>{
      const isPending=x.result==='Pending';
      const div=document.createElement('div');
      div.className='hlist-item';
      div.style.animationDelay=(i*0.05)+'s';
      div.innerHTML=`
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:40px;height:40px;border-radius:12px;background:${isPending?'#fef3c7':'#f0fdf4'};display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${isPending?'&#9201;':'&#9989;'}</div>
          <div>
            <div style="font-weight:600;font-size:14px">${escHtml(x.patient_name)}</div>
            <div style="font-size:12px;color:#64748b">${escHtml(x.test)}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="${isPending?'badge-pending':'badge-done'}">${escHtml(x.result)}</span>
          <button class="${isPending?'btn-primary-custom':'btn-secondary-custom'}" onclick="updateResult(${x.id},'${escHtml(x.result)}')" style="font-size:12px;padding:6px 14px">
            ${isPending?'Enter result':'Update'}
          </button>
        </div>`;
      listEl.appendChild(div);
    });
  }catch(e){loadEl.textContent='Network error.';}
}
loadLab();
</script>
{% endblock %}
