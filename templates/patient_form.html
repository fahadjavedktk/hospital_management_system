{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">Patient prescription</h2>

<div id="banner" class="alert" style="display:none"></div>

<div class="card p-4 shadow-sm col-md-6">

  <div class="mb-3 p-3 bg-light rounded">
    <strong>Patient:</strong> {{ patient.name | e }}<br>
    <small class="text-muted">Doctor: {{ patient.doctor.name | e }}</small>
  </div>

  <label class="form-label">Medicine</label>
  <select id="medicine" class="form-select">
    <option value="">-- Select medicine or type below --</option>
  </select>
  <input id="medicineCustom" class="form-control mt-2" placeholder="Or type medicine name manually" maxlength="100" autocomplete="off">
  <small class="text-muted">Select from inventory above, or type a name if not listed.</small>

  <label class="form-label mt-3">Quantity</label>
  <input id="qty" class="form-control" type="number" min="1" max="999" placeholder="e.g. 10">
  <small id="stockInfo" class="text-muted"></small>

  <label class="form-label mt-3">Lab test (optional)</label>
  <select id="test" class="form-select">
    <option value="">-- No test --</option>
    {% for t in tests %}
    <option value="{{ t | e }}">{{ t | e }}</option>
    {% endfor %}
  </select>

  <button id="submitBtn"
    data-pid="{{ patient.id | int }}"
    onclick="submitForm(this)"
    class="btn btn-success mt-4 w-100">
    Submit prescription
  </button>

</div>

<script>
  function showBanner(msg, type) {
    const b = document.getElementById('banner');
    b.className = 'alert alert-' + type;
    b.textContent = msg;
    b.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Load medicine dropdown from pharmacy inventory
  async function loadMeds() {
    try {
      const res = await fetch('/meds');
      if (!res.ok) return;
      const data = await res.json();
      const sel = document.getElementById('medicine');
      data.forEach(m => {
        const o = document.createElement('option');
        o.value = m.name;
        o.dataset.stock = m.stock;
        o.textContent = `${m.name} — Stock: ${m.stock} — PKR ${Number(m.price).toFixed(2)}`;
        sel.appendChild(o);
      });
    } catch(e) {}
  }

  document.getElementById('medicine').addEventListener('change', function() {
    const opt = this.options[this.selectedIndex];
    const info = document.getElementById('stockInfo');
    if (opt && opt.dataset.stock !== undefined) {
      info.textContent = `Available stock: ${opt.dataset.stock} units`;
      document.getElementById('medicineCustom').value = '';
    } else {
      info.textContent = '';
    }
  });

  async function submitForm(btn) {
    const selectedMed = document.getElementById('medicine').value.trim();
    const customMed   = document.getElementById('medicineCustom').value.trim();
    const medicine    = selectedMed || customMed;
    const qty         = document.getElementById('qty').value;
    const test        = document.getElementById('test').value;
    const pid         = btn.dataset.pid;

    if (!medicine) {
      showBanner('Please select a medicine or type one manually.', 'warning'); return;
    }
    if (!qty || Number(qty) < 1) {
      showBanner('Enter a valid quantity (minimum 1).', 'warning'); return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      const res = await fetch('/prescribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          patient_id: Number(pid),
          medicine:   medicine,
          qty:        Number(qty),
          test:       test
        })
      });

      const data = await res.json();

      if (!res.ok) {
        showBanner(data.error || 'Failed to save. Please try again.', 'danger');
        return;
      }

      showBanner('Prescription saved successfully.', 'success');
      setTimeout(() => { window.location = '/dashboard'; }, 1500);

    } catch (e) {
      showBanner('Network error. Check your connection and try again.', 'danger');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit prescription';
    }
  }

  loadMeds();
</script>

{% endblock %}
