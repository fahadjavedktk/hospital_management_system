{% extends "base.html" %}
{% block content %}

<div class="page-title"><i class="bi bi-clipboard2-pulse"></i> Doctor Panel</div>
<div id="banner" class="alert-banner"></div>

<div class="hcard">
  <div class="hcard-title"><i class="bi bi-people"></i> Your patients <span id="count" class="badge-info ms-2" style="font-size:11px;padding:3px 10px;border-radius:20px"></span></div>
  <div id="loading" class="loading-state"><div class="spinner"></div> Loading patients...</div>
  <div id="patientList"></div>
  <div id="emptyMsg" class="empty-state" style="display:none"><i class="bi bi-people"></i><p>No patients found</p></div>
</div>

<script>
function escHtml(s){const d=document.createElement('div');d.appendChild(document.createTextNode(String(s)));return d.innerHTML;}

async function load(){
  const loadEl=document.getElementById('loading');
  const listEl=document.getElementById('patientList');
  const emptyEl=document.getElementById('emptyMsg');
  const countEl=document.getElementById('count');
  try{
    const res=await fetch('/patients');
    if(!res.ok){loadEl.textContent='Failed to load patients.';loadEl.style.color='#dc2626';return;}
    const data=await res.json();
    loadEl.style.display='none';
    countEl.textContent=data.length+' patient'+(data.length!==1?'s':'');
    if(data.length===0){emptyEl.style.display='block';return;}
    emptyEl.style.display='none';
    data.forEach((p,i)=>{
      const div=document.createElement('div');
      div.className='hlist-item';
      div.style.cursor='pointer';
      div.style.animationDelay=(i*0.06)+'s';
      div.innerHTML=`
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:40px;height:40px;border-radius:12px;background:#eff6ff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#2563eb;flex-shrink:0">${escHtml(p.name[0].toUpperCase())}</div>
          <div>
            <div style="font-weight:600;font-size:14px">${escHtml(p.name)}</div>
            <div style="font-size:12px;color:#64748b">Age: ${p.age} &middot; Dr. ${escHtml(p.doctor)}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;color:#64748b">View &amp; prescribe</span>
          <i class="bi bi-arrow-right-circle" style="color:#2563eb;font-size:18px"></i>
        </div>`;
      div.onclick=()=>window.location='/patient/'+p.id;
      listEl.appendChild(div);
    });
  }catch(e){loadEl.textContent='Network error. Please refresh.';loadEl.style.color='#dc2626';}
}
load();
</script>
{% endblock %}
