{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">Doctor panel</h2>

<div id="banner" class="alert" style="display:none"></div>

<div class="card p-4 shadow-sm">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Select a patient</h5>
    <span id="count" class="badge bg-secondary"></span>
  </div>

  <div id="loading" class="text-muted">Loading patients...</div>
  <ul id="patients" class="list-group"></ul>
  <p id="emptyMsg" class="text-muted text-center mt-3" style="display:none">No patients found.</p>
</div>

<script>
  function escHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(String(str)));
    return d.innerHTML;
  }

  async function load() {
    const loadingEl = document.getElementById('loading');
    const listEl    = document.getElementById('patients');
    const countEl   = document.getElementById('count');
    const emptyEl   = document.getElementById('emptyMsg');

    try {
      const res = await fetch('/patients');
      if (!res.ok) {
        loadingEl.textContent = 'Failed to load patients.';
        loadingEl.className = 'text-danger';
        return;
      }

      const data = await res.json();
      loadingEl.style.display = 'none';
      listEl.innerHTML = '';
      countEl.textContent = data.length + ' patient' + (data.length !== 1 ? 's' : '');

      if (data.length === 0) { emptyEl.style.display = 'block'; return; }
      emptyEl.style.display = 'none';

      data.forEach(p => {
        const li = document.createElement('li');
        li.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
        li.style.cursor = 'pointer';
        li.innerHTML = `
          <div>
            <strong>${escHtml(p.name)}</strong>
            <small class="text-muted ms-2">Age: ${p.age}</small>
          </div>
          <span class="badge bg-primary">View &rarr;</span>`;
        li.onclick = () => { window.location = '/patient/' + p.id; };
        listEl.appendChild(li);
      });
    } catch (e) {
      loadingEl.textContent = 'Network error. Please refresh.';
      loadingEl.className = 'text-danger';
    }
  }

  load();
</script>

{% endblock %}
