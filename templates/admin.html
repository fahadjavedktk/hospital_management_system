{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">Admin panel</h2>

<div id="banner" class="alert" style="display:none"></div>

<div class="row g-4">

  <!-- ADD PATIENT -->
  <div class="col-md-5">
    <div class="card p-4 shadow-sm">
      <h5 class="mb-3">Add patient</h5>

      <label class="form-label">Full name</label>
      <input id="newName" class="form-control" placeholder="Patient full name" maxlength="100">

      <label class="form-label mt-3">Age</label>
      <input id="newAge" class="form-control" type="number" min="0" max="150" placeholder="Age">

      <label class="form-label mt-3">Assigned doctor</label>
      <input id="newDoctor" class="form-control" placeholder="Doctor name" maxlength="100">

      <button id="addBtn" onclick="addPatient()" class="btn btn-success mt-4 w-100">
        Add patient
      </button>
    </div>
  </div>

  <!-- PATIENT LIST -->
  <div class="col-md-7">
    <div class="card p-4 shadow-sm">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Patient list</h5>
        <span id="count" class="badge bg-secondary">0 patients</span>
      </div>
      <ul id="list" class="list-group"></ul>
      <p id="emptyMsg" class="text-muted text-center mt-3" style="display:none">No patients added yet.</p>
    </div>
  </div>

</div>

<script>
  function showBanner(msg, type) {
    const b = document.getElementById('banner');
    b.className = 'alert alert-' + type;
    b.textContent = msg;
    b.style.display = 'block';
    setTimeout(() => { b.style.display = 'none'; }, 4000);
  }

  async function addPatient() {
    const name   = document.getElementById('newName').value.trim();
    const age    = document.getElementById('newAge').value;
    const doctor = document.getElementById('newDoctor').value.trim();
    const btn    = document.getElementById('addBtn');

    if (!name) { showBanner('Patient name is required.', 'warning'); return; }
    if (!age || Number(age) < 0 || Number(age) > 150) {
      showBanner('Enter a valid age (0–150).', 'warning'); return;
    }
    if (!doctor) { showBanner('Doctor name is required.', 'warning'); return; }

    btn.disabled = true;
    btn.textContent = 'Adding...';

    try {
      const res = await fetch('/add_patient', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, age: Number(age), doctor })
      });

      const data = await res.json();
      if (!res.ok) { showBanner(data.error || 'Failed to add patient.', 'danger'); return; }

      showBanner('Patient added successfully.', 'success');
      document.getElementById('newName').value   = '';
      document.getElementById('newAge').value    = '';
      document.getElementById('newDoctor').value = '';
      loadPatients();
    } catch (e) {
      showBanner('Network error. Please try again.', 'danger');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Add patient';
    }
  }

  async function deletePatient(id, name) {
    if (!confirm(`Delete patient "${name}"? This cannot be undone.`)) return;

    try {
      const res = await fetch('/delete_patient/' + id, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok) { showBanner(data.error || 'Failed to delete.', 'danger'); return; }
      showBanner('Patient deleted.', 'success');
      loadPatients();
    } catch (e) {
      showBanner('Network error.', 'danger');
    }
  }

  async function loadPatients() {
    try {
      const res  = await fetch('/patients');
      if (!res.ok) { showBanner('Failed to load patients.', 'danger'); return; }
      const data = await res.json();

      const list     = document.getElementById('list');
      const emptyMsg = document.getElementById('emptyMsg');
      const count    = document.getElementById('count');

      list.innerHTML = '';
      count.textContent = data.length + ' patient' + (data.length !== 1 ? 's' : '');

      if (data.length === 0) { emptyMsg.style.display = 'block'; return; }
      emptyMsg.style.display = 'none';

      data.forEach(p => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';
        li.innerHTML = `
          <div>
            <strong>${escHtml(p.name)}</strong>
            <small class="text-muted ms-2">Age: ${p.age} &middot; Dr. ${escHtml(p.doctor)}</small>
          </div>`;

        const btn = document.createElement('button');
        btn.className = 'btn btn-outline-danger btn-sm';
        btn.textContent = 'Delete';
        btn.onclick = () => deletePatient(p.id, p.name);
        li.appendChild(btn);
        list.appendChild(li);
      });
    } catch (e) {
      showBanner('Failed to load patient list.', 'danger');
    }
  }

  // Prevent XSS when inserting patient data into the DOM
  function escHtml(str) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(String(str)));
    return div.innerHTML;
  }

  loadPatients();
</script>

{% endblock %}
