<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .navbar-brand { font-weight: 600; letter-spacing: .02em; }
    .role-badge {
      font-size: 11px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 2px 10px;
      border-radius: 20px;
      text-transform: capitalize;
    }
    .main-content { padding-bottom: 3rem; }
    .card { border: none; border-radius: 12px; }
    .alert { border-radius: 10px; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary px-3 py-2">
  <a class="navbar-brand">&#127973; Hospital MS</a>
  <div class="d-flex align-items-center gap-2">
    {% if current_user.is_authenticated %}
      <span class="role-badge">{{ current_user.role }}</span>
      <a href="/dashboard" class="btn btn-light btn-sm">Dashboard</a>
      <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    {% endif %}
  </div>
</nav>

<div class="container mt-4 main-content">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
